<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="linuxGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d2ff"/>
      <stop offset="100%" style="stop-color:#3a7bd5"/>
    </linearGradient>
    <linearGradient id="winPit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d2d2d"/>
      <stop offset="100%" style="stop-color:#0a0a0a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="500" fill="url(#bg)"/>

  <!-- Stars / dots in background -->
  <circle cx="50" cy="60" r="1.5" fill="#fff" opacity="0.4"/>
  <circle cx="150" cy="30" r="1" fill="#fff" opacity="0.3"/>
  <circle cx="250" cy="50" r="1.5" fill="#fff" opacity="0.5"/>
  <circle cx="400" cy="40" r="1" fill="#fff" opacity="0.3"/>
  <circle cx="500" cy="70" r="1.5" fill="#fff" opacity="0.4"/>
  <circle cx="550" cy="25" r="1" fill="#fff" opacity="0.3"/>
  <circle cx="80" cy="120" r="1" fill="#fff" opacity="0.2"/>
  <circle cx="520" cy="110" r="1.5" fill="#fff" opacity="0.3"/>
  <circle cx="350" cy="20" r="1" fill="#fff" opacity="0.4"/>
  <circle cx="450" cy="90" r="1" fill="#fff" opacity="0.2"/>

  <!-- === LINUX SAVIOR (top) === -->
  <!-- Linux penguin body -->
  <g transform="translate(300, 55)" filter="url(#glow)">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="28" ry="22" fill="#f8c630"/>
    <!-- Head -->
    <circle cx="0" cy="-28" r="16" fill="#1a1a2e" stroke="#f8c630" stroke-width="2"/>
    <!-- Eyes -->
    <circle cx="-6" cy="-30" r="3" fill="#fff"/>
    <circle cx="6" cy="-30" r="3" fill="#fff"/>
    <circle cx="-6" cy="-30" r="1.5" fill="#000"/>
    <circle cx="6" cy="-30" r="1.5" fill="#000"/>
    <!-- Beak -->
    <polygon points="-4,-25 4,-25 0,-21" fill="#f8c630"/>
    <!-- Cape -->
    <path d="M-28,0 Q-45,-40 0,-50 Q45,-40 28,0" fill="#00d2ff" opacity="0.6"/>
    <!-- Arms reaching down -->
    <line x1="-28" y1="-5" x2="-55" y2="35" stroke="#f8c630" stroke-width="4" stroke-linecap="round"/>
    <line x1="28" y1="-5" x2="55" y2="35" stroke="#f8c630" stroke-width="4" stroke-linecap="round"/>
    <!-- Superman fist -->
    <circle cx="-55" cy="35" r="5" fill="#f8c630" stroke="#1a1a2e" stroke-width="1"/>
    <circle cx="55" cy="35" r="5" fill="#f8c630" stroke="#1a1a2e" stroke-width="1"/>
  </g>

  <!-- "LINUX" text above -->
  <text x="300" y="15" text-anchor="middle" fill="#00d2ff" font-family="Arial Black, sans-serif" font-size="16" font-weight="bold" filter="url(#glow)">🐧 LINUX</text>

  <!-- === THE OLD PC (center) === -->
  <g transform="translate(300, 250)" filter="url(#shadow)">
    <!-- Monitor -->
    <rect x="-70" y="-60" width="140" height="100" rx="8" fill="#e0e0e0" stroke="#999" stroke-width="2"/>
    <!-- Screen -->
    <rect x="-60" y="-52" width="120" height="80" rx="4" fill="#1a1a2e"/>
    <!-- Screen content - generic desktop -->
    <rect x="-52" y="-44" width="104" height="8" rx="2" fill="#0078d4" opacity="0.8"/>
    <rect x="-52" y="-30" width="40" height="6" rx="2" fill="#4a4a6a" opacity="0.5"/>
    <rect x="-52" y="-20" width="50" height="6" rx="2" fill="#4a4a6a" opacity="0.5"/>
    <rect x="-52" y="-10" width="30" height="6" rx="2" fill="#4a4a6a" opacity="0.5"/>
    <!-- Blue screen error on screen -->
    <rect x="-50" y="-45" width="100" height="65" rx="3" fill="#106ebe" opacity="0.3"/>
    <text x="0" y="-15" text-anchor="middle" fill="#fff" font-family="monospace" font-size="8" opacity="0.6">:(</text>
    <!-- Stand -->
    <rect x="-10" y="40" width="20" height="25" fill="#ccc" stroke="#999" stroke-width="1"/>
    <!-- Base -->
    <rect x="-30" y="62" width="60" height="8" rx="3" fill="#ccc" stroke="#999" stroke-width="1"/>
    <!-- Sweat drops on PC -->
    <ellipse cx="-50" cy="-30" rx="3" ry="5" fill="#00d2ff" opacity="0.6"/>
    <ellipse cx="50" cy="-35" rx="2" ry="4" fill="#00d2ff" opacity="0.4"/>
    <ellipse cx="-40" cy="-20" rx="2" ry="3" fill="#00d2ff" opacity="0.3"/>

    <!-- Face on the screen -->
    <!-- Eyes (worried) -->
    <ellipse cx="-15" cy="5" rx="6" ry="7" fill="#fff"/>
    <ellipse cx="15" cy="5" rx="6" ry="7" fill="#fff"/>
    <circle cx="-13" cy="5" r="3" fill="#333"/>
    <circle cx="17" cy="5" r="3" fill="#333"/>
    <!-- Eyebrows (worried) -->
    <line x1="-22" y1="-5" x2="-8" y2="-3" stroke="#333" stroke-width="2" stroke-linecap="round"/>
    <line x1="8" y1="-3" x2="22" y2="-5" stroke="#333" stroke-width="2" stroke-linecap="round"/>
    <!-- Mouth (worried frown) -->
    <path d="M-10,18 Q0,13 10,18" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
    <!-- Tear -->
    <ellipse cx="-20" cy="14" rx="2" ry="4" fill="#00d2ff" opacity="0.7"/>
  </g>

  <!-- === CHAINS === -->
  <!-- Left chain -->
  <g stroke="#888" stroke-width="3" fill="none">
    <ellipse cx="230" cy="310" rx="6" ry="4" stroke-width="2"/>
    <ellipse cx="230" cy="325" rx="6" ry="4" stroke-width="2"/>
    <ellipse cx="230" cy="340" rx="6" ry="4" stroke-width="2"/>
    <ellipse cx="230" cy="355" rx="6" ry="4" stroke-width="2"/>
    <ellipse cx="230" cy="370" rx="6" ry="4" stroke-width="2"/>
    <ellipse cx="230" cy="385" rx="6" ry="4" stroke-width="2"/>
  </g>
  <!-- Right chain -->
  <g stroke="#888" stroke-width="3" fill="none">
    <ellipse cx="370" cy="310" rx="6" ry="4" stroke-width="2"/>
    <ellipse cx="370" cy="325" rx="6" ry="4" stroke-width="2"/>
    <ellipse cx="370" cy="340" rx="6" ry="4" stroke-width="2"/>
    <ellipse cx="370" cy="355" rx="6" ry="4" stroke-width="2"/>
    <ellipse cx="370" cy="370" rx="6" ry="4" stroke-width="2"/>
    <ellipse cx="370" cy="385" rx="6" ry="4" stroke-width="2"/>
  </g>

  <!-- === WINDOWS PIT / DEMONS (bottom) === -->
  <!-- Pit / hole -->
  <ellipse cx="300" cy="440" rx="180" ry="50" fill="url(#winPit)" opacity="0.9"/>
  <ellipse cx="300" cy="435" rx="170" ry="40" fill="#1a1a1a" opacity="0.8"/>
  <ellipse cx="300" cy="430" rx="160" ry="30" fill="#111" opacity="0.7"/>

  <!-- Windows flag logo in pit -->
  <g transform="translate(300, 410)" opacity="0.3">
    <rect x="-12" y="-12" width="10" height="10" fill="#00adef"/>
    <rect x="2" y="-12" width="10" height="10" fill="#00adef"/>
    <rect x="-12" y="2" width="10" height="10" fill="#00adef"/>
    <rect x="2" y="2" width="10" height="10" fill="#00adef"/>
  </g>

  <!-- Chain going into pit -->
  <g stroke="#888" stroke-width="3" fill="none">
    <ellipse cx="230" cy="400" rx="6" ry="4" stroke-width="2"/>
    <ellipse cx="230" cy="415" rx="6" ry="4" stroke-width="2"/>
    <ellipse cx="230" cy="430" rx="6" ry="4" stroke-width="2"/>
    <ellipse cx="370" cy="400" rx="6" ry="4" stroke-width="2"/>
    <ellipse cx="370" cy="415" rx="6" ry="4" stroke-width="2"/>
    <ellipse cx="370" cy="430" rx="6" ry="4" stroke-width="2"/>
  </g>

  <!-- Windows Demons - little cartoon devils holding chains -->
  <!-- Left demon -->
  <g transform="translate(200, 395)">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="18" ry="14" fill="#e63946"/>
    <!-- Head -->
    <circle cx="0" cy="-15" r="12" fill="#e63946" stroke="#c1121f" stroke-width="1"/>
    <!-- Eyes (evil) -->
    <circle cx="-5" cy="-17" r="4" fill="#fff"/>
    <circle cx="5" cy="-17" r="4" fill="#fff"/>
    <circle cx="-4" cy="-17" r="2" fill="#000"/>
    <circle cx="6" cy="-17" r="2" fill="#000"/>
    <!-- Eyebrows (angry) -->
    <line x1="-10" y1="-24" x2="-2" y2="-21" stroke="#000" stroke-width="2" stroke-linecap="round"/>
    <line x1="2" y1="-21" x2="10" y2="-24" stroke="#000" stroke-width="2" stroke-linecap="round"/>
    <!-- Mouth (evil grin) -->
    <path d="M-6,-10 Q0,-6 6,-10" fill="none" stroke="#000" stroke-width="1.5"/>
    <!-- Horns -->
    <polygon points="-8,-27 -5,-38 -2,-27" fill="#c1121f"/>
    <polygon points="2,-27 5,-38 8,-27" fill="#c1121f"/>
    <!-- Tail -->
    <path d="M18,5 Q30,15 25,25 Q22,30 28,28" fill="none" stroke="#e63946" stroke-width="2" stroke-linecap="round"/>
    <polygon points="28,28 25,23 32,26" fill="#c1121f"/>
    <!-- Arms holding chain -->
    <line x1="-18" y1="-5" x2="-8" y2="15" stroke="#e63946" stroke-width="4" stroke-linecap="round" stroke="black" opacity="0.3"/>
    <line x1="-5" y1="10" x2="8" y2="12" stroke="#e63946" stroke-width="4" stroke-linecap="round"/>
    <!-- Pitchfork -->
    <line x1="15" y1="-5" x2="22" y2="-25" stroke="#555" stroke-width="2"/>
    <line x1="18" y1="-25" x2="22" y2="-25" stroke="#555" stroke-width="2"/>
    <line x1="22" y1="-25" x2="26" y2="-25" stroke="#555" stroke-width="2"/>
    <!-- Chain grabbing -->
    <circle cx="-5" cy="12" r="3" fill="none" stroke="#888" stroke-width="2"/>
  </g>

  <!-- Right demon -->
  <g transform="translate(400, 395)">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="18" ry="14" fill="#e63946"/>
    <!-- Head -->
    <circle cx="0" cy="-15" r="12" fill="#e63946" stroke="#c1121f" stroke-width="1"/>
    <!-- Eyes -->
    <circle cx="-5" cy="-17" r="4" fill="#fff"/>
    <circle cx="5" cy="-17" r="4" fill="#fff"/>
    <circle cx="-4" cy="-17" r="2" fill="#000"/>
    <circle cx="6" cy="-17" r="2" fill="#000"/>
    <!-- Eyebrows -->
    <line x1="-10" y1="-24" x2="-2" y2="-21" stroke="#000" stroke-width="2" stroke-linecap="round"/>
    <line x1="2" y1="-21" x2="10" y2="-24" stroke="#000" stroke-width="2" stroke-linecap="round"/>
    <!-- Mouth -->
    <path d="M-6,-10 Q0,-6 6,-10" fill="none" stroke="#000" stroke-width="1.5"/>
    <!-- Horns -->
    <polygon points="-8,-27 -5,-38 -2,-27" fill="#c1121f"/>
    <polygon points="2,-27 5,-38 8,-27" fill="#c1121f"/>
    <!-- Tail -->
    <path d="M-18,5 Q-30,15 -25,25 Q-22,30 -28,28" fill="none" stroke="#e63946" stroke-width="2" stroke-linecap="round"/>
    <polygon points="-28,28 -25,23 -32,26" fill="#c1121f"/>
    <!-- Arms -->
    <line x1="18" y1="-5" x2="8" y2="15" stroke="#e63946" stroke-width="4" stroke-linecap="round"/>
    <line x1="5" y1="10" x2="-8" y2="12" stroke="#e63946" stroke-width="4" stroke-linecap="round"/>
    <!-- Chain grabbing -->
    <circle cx="5" cy="12" r="3" fill="none" stroke="#888" stroke-width="2"/>
  </g>

  <!-- === OVERLAY TEXT === -->
  <text x="300" y="485" text-anchor="middle" fill="#ff6b6b" font-family="Arial, sans-serif" font-size="18" font-weight="bold" filter="url(#glow)">⬇ WINDOWS 10 PIT ⬇</text>

  <!-- Pull-up arrows -->
  <g filter="url(#glow)" opacity="0.7">
    <polygon points="260,160 280,140 270,140 270,120 250,120 250,140 240,140" fill="#00d2ff"/>
    <polygon points="340,160 360,140 350,140 350,120 330,120 330,140 320,140" fill="#00d2ff"/>
  </g>

  <!-- Speed lines (being pulled up) -->
  <line x1="240" y1="185" x2="248" y2="175" stroke="#fff" stroke-width="1" opacity="0.3"/>
  <line x1="360" y1="185" x2="352" y2="175" stroke="#fff" stroke-width="1" opacity="0.3"/>
  <line x1="255" y1="195" x2="260" y2="185" stroke="#fff" stroke-width="1" opacity="0.2"/>
  <line x1="345" y1="195" x2="340" y2="185" stroke="#fff" stroke-width="1" opacity="0.2"/>

</svg>
