<!DOCTYPE html>
<html>
<head><title>Old PC Chained - Linux Rescue</title></head>
<body style="margin:0;background:#111;display:flex;justify-content:center;align-items:center;min-height:100vh;">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="90%" height="90%" style="max-width:600px;">
    <defs>
      <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#1a1a2e"/>
        <stop offset="100%" stop-color="#16213e"/>
      </linearGradient>
      <linearGradient id="winPit" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#2d2d2d"/>
        <stop offset="100%" stop-color="#0a0a0a"/>
      </linearGradient>
      <filter id="glow">
        <feGaussianBlur stdDeviation="3" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="shadow">
        <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.5"/>
      </filter>
    </defs>

    <!-- Background -->
    <rect width="600" height="500" fill="url(#bg)"/>

    <!-- Stars -->
    <circle cx="50" cy="60" r="1.5" fill="#fff" opacity="0.4"/>
    <circle cx="150" cy="30" r="1" fill="#fff" opacity="0.3"/>
    <circle cx="250" cy="50" r="1.5" fill="#fff" opacity="0.5"/>
    <circle cx="400" cy="40" r="1" fill="#fff" opacity="0.3"/>
    <circle cx="500" cy="70" r="1.5" fill="#fff" opacity="0.4"/>
    <circle cx="550" cy="25" r="1" fill="#fff" opacity="0.3"/>
    <circle cx="80" cy="120" r="1" fill="#fff" opacity="0.2"/>
    <circle cx="520" cy="110" r="1.5" fill="#fff" opacity="0.3"/>
    <circle cx="350" cy="20" r="1" fill="#fff" opacity="0.4"/>
    <circle cx="450" cy="90" r="1" fill="#fff" opacity="0.2"/>

    <!-- LINUX text -->
    <text x="300" y="28" text-anchor="middle" fill="#00d2ff" font-family="Arial Black,sans-serif" font-size="18" font-weight="bold" filter="url(#glow)">LINUX</text>

    <!-- Penguin hero -->
    <g transform="translate(300, 68)">
      <!-- Cape -->
      <path d="M-28,-3 Q-48,-45 0,-55 Q48,-45 28,-3" fill="#00d2ff" opacity="0.5"/>
      <!-- Body -->
      <ellipse cx="0" cy="0" rx="26" ry="20" fill="#f8c630"/>
      <!-- Head -->
      <circle cx="0" cy="-24" r="15" fill="#1a1a2e" stroke="#f8c630" stroke-width="2"/>
      <!-- Eyes -->
      <circle cx="-5" cy="-26" r="3" fill="#fff"/>
      <circle cx="5" cy="-26" r="3" fill="#fff"/>
      <circle cx="-5" cy="-26" r="1.5" fill="#000"/>
      <circle cx="5" cy="-26" r="1.5" fill="#000"/>
      <!-- Beak -->
      <polygon points="-4,-21 4,-21 0,-17" fill="#f8c630"/>
      <!-- Arms reaching down -->
      <line x1="-26" y1="-2" x2="-52" y2="38" stroke="#f8c630" stroke-width="4" stroke-linecap="round"/>
      <line x1="26" y1="-2" x2="52" y2="38" stroke="#f8c630" stroke-width="4" stroke-linecap="round"/>
      <!-- Fists -->
      <circle cx="-52" cy="38" r="5" fill="#f8c630" stroke="#1a1a2e" stroke-width="1"/>
      <circle cx="52" cy="38" r="5" fill="#f8c630" stroke="#1a1a2e" stroke-width="1"/>
    </g>

    <!-- Pull-up arrows -->
    <g filter="url(#glow)" opacity="0.7">
      <polygon points="255,175 275,155 265,155 265,135 245,135 245,155 235,155" fill="#00d2ff"/>
      <polygon points="345,175 365,155 355,155 355,135 335,135 335,155 325,155" fill="#00d2ff"/>
    </g>

    <!-- Speed lines -->
    <line x1="240" y1="198" x2="248" y2="188" stroke="#fff" stroke-width="1" opacity="0.3"/>
    <line x1="360" y1="198" x2="352" y2="188" stroke="#fff" stroke-width="1" opacity="0.3"/>

    <!-- === OLD PC === -->
    <g transform="translate(300, 260)" filter="url(#shadow)">
      <!-- Monitor -->
      <rect x="-75" y="-65" width="150" height="110" rx="8" fill="#ddd" stroke="#999" stroke-width="2"/>
      <!-- Screen -->
      <rect x="-65" y="-57" width="130" height="85" rx="4" fill="#1a1a2e"/>
      <!-- Taskbar -->
      <rect x="-65" y="18" width="130" height="10" fill="#0078d4" opacity="0.8"/>
      <!-- Blue screen overlay -->
      <rect x="-60" y="-52" width="120" height="65" rx="3" fill="#106ebe" opacity="0.25"/>
      <!-- Sad face on screen -->
      <text x="0" y="-20" text-anchor="middle" fill="#fff" font-family="monospace" font-size="10" opacity="0.5">: (</text>
      <!-- Stand -->
      <rect x="-12" y="45" width="24" height="20" fill="#ccc" stroke="#999" stroke-width="1"/>
      <rect x="-35" y="63" width="70" height="8" rx="3" fill="#ccc" stroke="#999" stroke-width="1"/>
      <!-- Sweat -->
      <ellipse cx="-55" cy="-35" rx="3" ry="5" fill="#00d2ff" opacity="0.5"/>
      <ellipse cx="55" cy="-40" rx="2" ry="4" fill="#00d2ff" opacity="0.3"/>

      <!-- Worried face -->
      <ellipse cx="-16" cy="2" rx="7" ry="8" fill="#fff"/>
      <ellipse cx="16" cy="2" rx="7" ry="8" fill="#fff"/>
      <circle cx="-14" cy="3" r="3.5" fill="#333"/>
      <circle cx="18" cy="3" r="3.5" fill="#333"/>
      <line x1="-24" y1="-8" x2="-8" y2="-5" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="8" y1="-5" x2="24" y2="-8" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M-12,16 Q0,11 12,16" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
      <ellipse cx="-22" cy="12" rx="2.5" ry="4" fill="#00d2ff" opacity="0.6"/>
    </g>

    <!-- Chains -->
    <g stroke="#888" stroke-width="3" fill="none">
      <ellipse cx="225" cy="320" rx="7" ry="4" stroke-width="2"/>
      <ellipse cx="225" cy="335" rx="7" ry="4" stroke-width="2"/>
      <ellipse cx="225" cy="350" rx="7" ry="4" stroke-width="2"/>
      <ellipse cx="225" cy="365" rx="7" ry="4" stroke-width="2"/>
      <ellipse cx="225" cy="380" rx="7" ry="4" stroke-width="2"/>
      <ellipse cx="225" cy="395" rx="7" ry="4" stroke-width="2"/>
      <ellipse cx="225" cy="410" rx="7" ry="4" stroke-width="2"/>
      <ellipse cx="375" cy="320" rx="7" ry="4" stroke-width="2"/>
      <ellipse cx="375" cy="335" rx="7" ry="4" stroke-width="2"/>
      <ellipse cx="375" cy="350" rx="7" ry="4" stroke-width="2"/>
      <ellipse cx="375" cy="365" rx="7" ry="4" stroke-width="2"/>
      <ellipse cx="375" cy="380" rx="7" ry="4" stroke-width="2"/>
      <ellipse cx="375" cy="395" rx="7" ry="4" stroke-width="2"/>
      <ellipse cx="375" cy="410" rx="7" ry="4" stroke-width="2"/>
    </g>

    <!-- === PIT === -->
    <ellipse cx="300" cy="455" rx="190" ry="50" fill="url(#winPit)" opacity="0.9"/>
    <ellipse cx="300" cy="450" rx="180" ry="40" fill="#111" opacity="0.8"/>
    <ellipse cx="300" cy="445" rx="170" ry="30" fill="#080808" opacity="0.7"/>

    <!-- Windows logo in pit -->
    <g transform="translate(300, 430)" opacity="0.25">
      <rect x="-14" y="-14" width="12" height="12" fill="#00adef"/>
      <rect x="2" y="-14" width="12" height="12" fill="#00adef"/>
      <rect x="-14" y="2" width="12" height="12" fill="#00adef"/>
      <rect x="2" y="2" width="12" height="12" fill="#00adef"/>
    </g>

    <!-- === DEMONS === -->
    <!-- Left demon -->
    <g transform="translate(190, 415)">
      <ellipse cx="0" cy="0" rx="18" ry="14" fill="#e63946"/>
      <circle cx="0" cy="-15" r="12" fill="#e63946" stroke="#c1121f" stroke-width="1"/>
      <circle cx="-5" cy="-17" r="3.5" fill="#fff"/>
      <circle cx="5" cy="-17" r="3.5" fill="#fff"/>
      <circle cx="-4" cy="-17" r="2" fill="#000"/>
      <circle cx="6" cy="-17" r="2" fill="#000"/>
      <line x1="-10" y1="-23" x2="-2" y2="-20" stroke="#000" stroke-width="2" stroke-linecap="round"/>
      <line x1="2" y1="-20" x2="10" y2="-23" stroke="#000" stroke-width="2" stroke-linecap="round"/>
      <path d="M-6,-10 Q0,-6 6,-10" fill="none" stroke="#000" stroke-width="1.5"/>
      <polygon points="-9,-26 -5,-36 -1,-26" fill="#c1121f"/>
      <polygon points="1,-26 5,-36 9,-26" fill="#c1121f"/>
      <path d="M18,5 Q28,15 24,22" fill="none" stroke="#e63946" stroke-width="2.5" stroke-linecap="round"/>
      <polygon points="24,22 20,18 27,20" fill="#c1121f"/>
      <line x1="15" y1="-8" x2="22" y2="-28" stroke="#555" stroke-width="2"/>
      <line x1="18" y1="-28" x2="22" y2="-28" stroke="#555" stroke-width="2"/>
      <line x1="22" y1="-28" x2="26" y2="-28" stroke="#555" stroke-width="2"/>
    </g>

    <!-- Right demon -->
    <g transform="translate(410, 415)">
      <ellipse cx="0" cy="0" rx="18" ry="14" fill="#e63946"/>
      <circle cx="0" cy="-15" r="12" fill="#e63946" stroke="#c1121f" stroke-width="1"/>
      <circle cx="-5" cy="-17" r="3.5" fill="#fff"/>
      <circle cx="5" cy="-17" r="3.5" fill="#fff"/>
      <circle cx="-4" cy="-17" r="2" fill="#000"/>
      <circle cx="6" cy="-17" r="2" fill="#000"/>
      <line x1="-10" y1="-23" x2="-2" y2="-20" stroke="#000" stroke-width="2" stroke-linecap="round"/>
      <line x1="2" y1="-20" x2="10" y2="-23" stroke="#000" stroke-width="2" stroke-linecap="round"/>
      <path d="M-6,-10 Q0,-6 6,-10" fill="none" stroke="#000" stroke-width="1.5"/>
      <polygon points="-9,-26 -5,-36 -1,-26" fill="#c1121f"/>
      <polygon points="1,-26 5,-36 9,-26" fill="#c1121f"/>
      <path d="M-18,5 Q-28,15 -24,22" fill="none" stroke="#e63946" stroke-width="2.5" stroke-linecap="round"/>
      <polygon points="-24,22 -20,18 -27,20" fill="#c1121f"/>
    </g>

    <!-- Bottom label -->
    <text x="300" y="498" text-anchor="middle" fill="#ff6b6b" font-family="Arial,sans-serif" font-size="15" font-weight="bold" filter="url(#glow)">WINDOWS 10 PIT</text>
  </svg>
</body>
</html>
